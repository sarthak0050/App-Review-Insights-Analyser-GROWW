name: Weekly changelog

# Regenerates CHANGELOG.md from the commit history every week and commits the
# result *as the repo owner* when a personal access token is configured, so the
# automation is credited to you instead of github-actions[bot].
#
# One-time setup (this is the only manual step):
#   1. Create a FINE-GRAINED token limited to this repo with
#      Contents: Read and write.  https://github.com/settings/personal-access-tokens/new
#   2. Add it as a repository secret named PAT_TOKEN
#      (Settings -> Secrets and variables -> Actions -> New repository secret)
#
# Without PAT_TOKEN the job still regenerates the file and shows the diff, but
# skips the commit, so no github-actions[bot] noise is added.

on:
  schedule:
    - cron: '13 7 * * 3' # Wednesdays, 07:13 UTC
  workflow_dispatch:
    inputs:
      force_commit:
        description: "Commit even without PAT_TOKEN (will be authored by github-actions[bot])"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        id: gen
        run: |
          set -euo pipefail
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
            LABEL="Changes since ${LAST_TAG}"
          elif git rev-parse --verify --quiet HEAD~30 >/dev/null; then
            RANGE="HEAD~30..HEAD"
            LABEL="Changes in the last 30 commits"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
            LABEL="Full history (no tag, fewer than 30 commits)"
          fi
          COUNT="$(git rev-list --count "$RANGE" 2>/dev/null || echo 0)"
          if [ "$COUNT" -eq 0 ]; then
            echo "No new commits in range; leaving CHANGELOG.md untouched."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "# Changelog"
            echo
            echo "> Generated by \`.github/workflows/weekly-changelog.yml\` from the commit log."
            echo "> Commits on the default branch, newest first."
            echo
            echo "## $LABEL"
            echo
            git log "$RANGE" --date=short --pretty=format:'- %ad \`%h\` %s'
            echo
            echo
            echo "---"
            echo
            echo "_Regenerated automatically. Edit \`CHANGELOG.md\` by hand and it will be replaced; commit messages are the source of truth._"
          } > CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGELOG.md updated with $COUNT commit(s)."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit (as repo owner when PAT_TOKEN is set)
        if: steps.gen.outputs.changed == 'true'
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          FORCE: ${{ inputs.force_commit }}
        run: |
          set -euo pipefail
          git config user.name "sarthak singh"
          if [ -n "${PAT_TOKEN:-}" ]; then
            git config user.email "sarthaksingh@gmail.com"
            git remote set-url origin "https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            echo "Using PAT_TOKEN — commit will be attributed to the token owner."
          elif [ "${FORCE:-false}" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            echo "PAT_TOKEN not set; committing as github-actions[bot)."
          else
            echo "PAT_TOKEN secret is not configured — skipping commit."
            echo "Add it here: https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            exit 0
          fi
          git add CHANGELOG.md
          git commit -m "docs: regenerate CHANGELOG ($(date -u +%Y-%m-%d))"
          git push
